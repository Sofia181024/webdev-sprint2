<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scan</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div class="container">

       <h1>Sistema Inteligente de Estudos</h1>

       <input
            type="file"
            id="imagem"
            accept="image/*"
            capture="environment">

       <input type="date" id="data">

       <input type="time" id="hora">

       <input
           type="text"
           id="descricao"
           placeholder="Descrição da imagem"
       >

       <button id="btnSalvar">
           Salvar Lembrete
       </button>

       <div id="resultado"></div>

       <img id="preview">

   </div>

   <script src="script.js"></script>
    
</body>
</html>
